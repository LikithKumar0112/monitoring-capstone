# Project 5.4 — Scaling with Thanos.
# Two "regional" leaf Prometheus instances -> Thanos sidecars upload their TSDB
# blocks to MinIO (S3) -> Thanos Store serves history from the bucket ->
# Thanos Compact compacts/downsamples -> Thanos Query fans out over sidecars +
# store and dedups replicas -> Grafana queries Thanos Query. A federation master
# is included separately purely to contrast the older scaling approach.
name: monitoring-5-4

services:
  # ---------- Object storage ----------
  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin        # dev defaults; matches thanos/objstore.yml
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: create the 'thanos' bucket, then exit. Sidecars/store wait on this.
  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/thanos &&
        echo "bucket 'thanos' ready"
    restart: "no"

  # ---------- Host metrics (one per region) ----------
  node-exporter-us:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter-us
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave

  node-exporter-eu:
    image: prom/node-exporter:v1.8.2
    container_name: node-exporter-eu
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave

  # ---------- Leaf Prometheus instances ----------
  # CRITICAL: --storage.tsdb.min-block-duration and max-block-duration are both
  # pinned to 2h to DISABLE Prometheus's local block compaction. The Thanos
  # sidecar uploads each raw 2h block to the bucket; Thanos Compact then owns all
  # compaction/downsampling globally. If Prometheus were left to compact locally,
  # it would rewrite blocks the sidecar had already uploaded, and Thanos Compact
  # would find OVERLAPPING blocks in the bucket and HALT. Same reason on both.
  prometheus-us:
    image: prom/prometheus:v2.54.1
    container_name: prometheus-us
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.min-block-duration=2h    # disable local compaction (see note above)
      - --storage.tsdb.max-block-duration=2h
      - --storage.tsdb.retention.time=6h         # keep just enough locally; bucket is the archive
      - --web.enable-lifecycle
    volumes:
      - ./prometheus-us/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_us_data:/prometheus
    ports:
      - "9090:9090"

  prometheus-eu:
    image: prom/prometheus:v2.54.1
    container_name: prometheus-eu
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.min-block-duration=2h
      - --storage.tsdb.max-block-duration=2h
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    volumes:
      - ./prometheus-eu/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_eu_data:/prometheus
    ports:
      - "9092:9090"

  # Federation master — CONTRAST ONLY, not part of the Thanos path (see its config).
  prometheus-fed:
    image: prom/prometheus:v2.54.1
    container_name: prometheus-fed
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./prometheus-fed/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_fed_data:/prometheus
    ports:
      - "9091:9090"

  # ---------- Thanos ----------
  # Sidecar runs next to each leaf: reads its TSDB, uploads blocks to the bucket,
  # and serves that Prometheus's fresh (not-yet-uploaded) data to Query over gRPC.
  thanos-sidecar-us:
    image: quay.io/thanos/thanos:v0.36.1
    container_name: thanos-sidecar-us
    restart: unless-stopped
    depends_on:
      minio-init:
        condition: service_completed_successfully
    command:
      - sidecar
      - --tsdb.path=/prometheus
      - --prometheus.url=http://prometheus-us:9090
      - --objstore.config-file=/etc/thanos/objstore.yml
      - --grpc-address=0.0.0.0:10901
      - --http-address=0.0.0.0:10902
    volumes:
      - prometheus_us_data:/prometheus:ro          # same volume as prometheus-us
      - ./thanos/objstore.yml:/etc/thanos/objstore.yml:ro

  thanos-sidecar-eu:
    image: quay.io/thanos/thanos:v0.36.1
    container_name: thanos-sidecar-eu
    restart: unless-stopped
    depends_on:
      minio-init:
        condition: service_completed_successfully
    command:
      - sidecar
      - --tsdb.path=/prometheus
      - --prometheus.url=http://prometheus-eu:9090
      - --objstore.config-file=/etc/thanos/objstore.yml
      - --grpc-address=0.0.0.0:10901
      - --http-address=0.0.0.0:10902
    volumes:
      - prometheus_eu_data:/prometheus:ro
      - ./thanos/objstore.yml:/etc/thanos/objstore.yml:ro

  # Store Gateway: makes the historical blocks in the bucket queryable over gRPC.
  thanos-store:
    image: quay.io/thanos/thanos:v0.36.1
    container_name: thanos-store
    restart: unless-stopped
    # Named volumes are created root-owned, but the thanos image runs as nobody
    # (uid 65534), so it can't mkdir its data-dir. Run as root here for simplicity.
    # Alternative: an init container that chowns the volume to 65534 first.
    user: "0:0"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    command:
      - store
      - --data-dir=/var/thanos/store          # local index cache, not the source of truth
      - --objstore.config-file=/etc/thanos/objstore.yml
      - --grpc-address=0.0.0.0:10901
      - --http-address=0.0.0.0:10902
    volumes:
      - thanos_store_data:/var/thanos/store
      - ./thanos/objstore.yml:/etc/thanos/objstore.yml:ro

  # Compact: global compaction + downsampling. --wait keeps it running as a
  # daemon instead of one pass and exit. Exactly ONE compactor per bucket.
  thanos-compact:
    image: quay.io/thanos/thanos:v0.36.1
    container_name: thanos-compact
    restart: unless-stopped
    # Same root-owned-volume reason as thanos-store above.
    user: "0:0"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    command:
      - compact
      - --data-dir=/var/thanos/compact
      - --objstore.config-file=/etc/thanos/objstore.yml
      - --http-address=0.0.0.0:10902
      - --wait
    volumes:
      - thanos_compact_data:/var/thanos/compact
      - ./thanos/objstore.yml:/etc/thanos/objstore.yml:ro

  # Query: the single query entrypoint. Fans out to both sidecars (fresh data)
  # and the store (history), and deduplicates the replica label.
  thanos-query:
    image: quay.io/thanos/thanos:v0.36.1
    container_name: thanos-query
    restart: unless-stopped
    depends_on:
      - thanos-sidecar-us
      - thanos-sidecar-eu
      - thanos-store
    command:
      - query
      - --grpc-address=0.0.0.0:10901
      - --http-address=0.0.0.0:10902
      - --query.replica-label=replica          # collapse series that differ only by replica
      - --endpoint=thanos-sidecar-us:10901
      - --endpoint=thanos-sidecar-eu:10901
      - --endpoint=thanos-store:10901
    ports:
      - "10902:10902"   # Thanos Query UI + Prometheus-compatible API

  # ---------- Visualization ----------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - thanos-query
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  minio_data:
  prometheus_us_data:
  prometheus_eu_data:
  prometheus_fed_data:
  thanos_store_data:
  thanos_compact_data:
  grafana_data:
